name: unittest
description: Check the package integrity via unittest.

runs:
  using: "composite"
  steps:
    - name: Install the package
      env:
        BRANCH: ${{ github.ref_name }}
      run: |
        python -m pip install .[test]
      shell: bash

    - name: Test with pytest
      env:
        BRANCH: ${{ github.ref_name }}
      id: pytest
      continue-on-error: true
      run: |
        python -m pytest ./tests/unittest --cov=warpfield --cov-report xml
      shell: bash

    - name: Send Coverage Report to CodeClimate
      if: ${{ steps.pytest.outcome == 'success' && github.event_name == 'push'}}
      uses: paambaati/codeclimate-action@v9.0.0
      env:
        CC_TEST_REPORTER_ID: ${{ env.CC_TEST_REPORTER_ID }}
      with:
        debug: false
        coverageLocations: coverage.xml:coverage.py

    - name: Send Coverage Report to qlty.cloud
      uses: qltysh/qlty-action/coverage@v1
      with:
        token: ${{ env.QLTY_COVERAGE_TOKEN }}
        files: coverage.xml

    - name: Notice Error
      if: ${{ steps.pytest.outcome == 'failure' }}
      run: exit 1
      shell: bash

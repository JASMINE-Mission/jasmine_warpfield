name: notebook
description: Check if the notebooks are successfully executed.

runs:
  using: composite
  steps:
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install .
        python -m pip install jupyter nbconvert
      shell: bash

    - name: Execute Jupyter notebook
      run: |
        set -u
        shopt -s nullglob
        cd notebook

        failed=()

        for notebook in *.ipynb
        do
          echo "Executing $notebook"

          if jupyter nbconvert \
            --to notebook \
            --inplace \
            --execute \
            "$notebook"
          then
            echo "Passed: $notebook"
          else
            echo "::error file=notebook/$notebook::Notebook execution failed"
            failed+=("$notebook")
          fi
        done

        if (( ${#failed[@]} > 0 ))
        then
          {
            echo "## Failed notebooks"
            printf -- '- `%s`\n' "${failed[@]}"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Failed notebooks:"
          printf '  %s\n' "${failed[@]}"
          exit 1
        fi
      shell: bash

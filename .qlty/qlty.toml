config_version = "0"

exclude_patterns = [
  "notebook/**",
  "scripts/**",
]

test_patterns = [
  "**/test/**",
  "**/tests/**",
  "**/test_**",
]

[smells]
mode = "comment"

[smells.boolean_logic]
threshold = 6

[smells.file_complexity]
threshold = 55

[smells.return_statements]
threshold = 4

[smells.nested_control_flow]
threshold = 4

[smells.function_parameters]
threshold = 4
enabled = false

[smells.function_complexity]
threshold = 5

[smells.duplication]
threshold = 22

[[source]]
name = "default"
default = true


[[plugin]]
name = "actionlint"

[[plugin]]
name = "bandit"

[[plugin]]
name = "checkov"

[[plugin]]
name = "markdownlint"
mode = "comment"

[[plugin]]
name = "prettier"

[[plugin]]
name = "radarlint-python"
mode = "comment"

[[plugin]]
name = "ripgrep"
mode = "comment"

[[plugin]]
name = "ruff"

[[plugin]]
name = "shellcheck"

[[plugin]]
name = "shfmt"

[[plugin]]
name = "trivy"
drivers = [
  "config",
]

[[plugin]]
name = "trufflehog"

[[plugin]]
name = "yamllint"


[[triage]]
match.rules = ["bandit:B101"]
match.file_patterns = ["tests/*"]
set.ignored = true


[[triage]]
match.rules = ["ruff:fmt"]
set.ignored = true
